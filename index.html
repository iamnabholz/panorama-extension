<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="color-scheme" content="light dark" />

        <!-- Icons, ignore apple-touch-icon since this is a web extension -->
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />

        <title>New Tab</title>

        <style>
            html,
            body {
                margin: 0;
                height: 100vh;
            }
            body {
                position: relative;
            }

            body::before,
            body::after {
                content: "";
                position: fixed;
                inset: 0;
                height: 100dvh;
                background-color: var(--background-color);
                background-image: var(--background-value);
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                z-index: -1;
                transition: opacity 0.3s ease-out;
                will-change: opacity;
            }

            body::before {
                /* sharp layer */
                transform: scale(1);
            }

            body::after {
                /* pre-blurred layer */
                filter: blur(4px);
                transform: scale(1.04);
                opacity: 0;
            }

            body.focused::after {
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <div id="app" style="display: contents; overflow: hidden"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
